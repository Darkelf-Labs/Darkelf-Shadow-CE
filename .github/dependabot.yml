
version: 2

updates:
  # Darkelf Shadow Python dependencies
  - package-ecosystem: "pip"
    directory: "/"

    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "UTC"

    open-pull-requests-limit: 1

    labels:
      - "dependencies"
      - "automated"

    commit-message:
      prefix: "deps"
      include: "scope"

    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "UTC"

    open-pull-requests-limit: 1

    labels:
      - "dependencies"
      - "automated"

    commit-message:
      prefix: "ci"

