version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "UTC"

    open-pull-requests-limit: 1

    versioning-strategy: increase

    labels:
      - dependencies
      - automated

    commit-message:
      prefix: "deps"
      include: "scope"

    assignees:
      - Darkelf2024

    reviewers:
      - Darkelf2024

    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

    groups:
      nextjs:
        patterns:
          - "next"
          - "@next/*"

      react:
        patterns:
          - "react"
          - "react-dom"

      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"

      typescript:
        patterns:
          - "typescript"
          - "@types/*"

      build-tools:
        patterns:
          - "sharp"
          - "postcss"
          - "@babel/*"

      remaining:
        patterns:
          - "*"

    ignore:
      - dependency-name: "node"

      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"

