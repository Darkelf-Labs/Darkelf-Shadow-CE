name: Bandit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '39 21 * * 5'

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Bandit
        run: python -m pip install "bandit==1.9.4" "bandit-sarif-formatter==1.1.1"

      - name: Bandit Scan
        run: python -m bandit -r . -f sarif -o results.sarif

      # Retain the report even when security findings fail the scan step.
      - name: Save Bandit report
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: bandit-results
          path: results.sarif

      - name: Upload code scanning report
        if: >-
          always() && hashFiles('results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
